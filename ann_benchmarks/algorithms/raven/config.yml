float:
  any:
  - base_args: ['@metric', '@dimension']
    constructor: Raven
    disabled: false
    docker_tag: ann-benchmarks-raven
    module: ann_benchmarks.algorithms.raven
    name: raven
    run_groups:
      # 固定 ef 模式：8 个 ef 值，建图 1 次
      raven-sq4:
        # 接受栈（2026-10-30）：R48 + raven::pipeline（MSE SQ4、维度置换+EA、nav 重建、BFS 重排、建图期 sd 自动校准）
        args:
          R: 48
          L: 200
          alpha: 1.2
          alpha_core: 1.0
          nav_m: 32
          directional: true
          quantization: sq4
          rerank_factor: 10
          po: 16
        query_args: [[20, 25, 30, 35, 40, 45, 50, 60, 70, 80, 100, 130, 160, 200, 250, 300, 350, 400, 500, 600, 800]]

      # Adaptive ef 模式：gamma × min_ef × max_ef 笛卡尔积
      # 基于 alpha_core=0.93 新曲线 Pareto 重新扫描 (adaptive_resweep)
      # 覆盖 0.945-0.981 全 recall 区间，包含低/中/高三段填隙
      raven-sq4-adaptive:
        args:
          R: 40
          L: 384
          alpha: 1.2
          alpha_core: 0.93
          nav_m: 32
          directional: true
          quantization: sq4
          rerank_factor: 5
          po: 16
          adaptive_ef: true
        query_args:
          - [2.0, 2.3, 2.5, 3.0, 3.5]
          - [25, 30, 35, 40]
          - [50, 55, 65, 75, 95, 100]

      # 多线程模式：16 线程，建图 1 次
      raven-sq4-mt:
        args:
          R: 40
          L: 384
          alpha: 1.2
          alpha_core: 0.93
          nav_m: 32
          directional: true
          quantization: sq4
          rerank_factor: 5
          po: 16
          threads: 16
        query_args: [[50]]
