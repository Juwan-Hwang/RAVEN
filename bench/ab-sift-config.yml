float:
  any:
  - base_args: ['@metric', '@dimension']
    constructor: Raven
    disabled: false
    docker_tag: ann-benchmarks-raven
    module: ann_benchmarks.algorithms.raven
    name: raven
    run_groups:
      sq4-R32:
        args: {R: 32, L: 200, alpha: 1.2, nav_m: 32, directional: true, quantization: sq4, rerank_factor: 5, po: 16}
        query_args: [[15, 20, 25, 30, 35, 40, 45, 50, 55, 60, 65, 70, 80, 90, 100, 120]]
      sq4-R48:
        args: {R: 48, L: 200, alpha: 1.2, nav_m: 32, directional: true, quantization: sq4, rerank_factor: 5, po: 16}
        query_args: [[15, 20, 25, 30, 35, 40, 45, 50, 55, 60, 65, 70, 80, 90, 100, 120]]
      sq8-R32:
        args: {R: 32, L: 200, alpha: 1.2, nav_m: 32, directional: true, quantization: sq8, rerank_factor: 5, po: 16}
        query_args: [[30, 40, 50, 60, 70, 80, 90, 100, 120]]
