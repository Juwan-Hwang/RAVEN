name: ann-benchmarks sift-128 (RAVEN vs others)
on:
  workflow_dispatch:
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          - {algo: raven, part: full}
          - {algo: kgn, part: all}
          - {algo: qsg_ngt, part: all}
          - {algo: descartes, part: "32"}
          - {algo: descartes, part: "64"}
          - {algo: descartes, part: "96"}
          - {algo: descartes, part: "128"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Machine
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)" | tee machine.txt
          grep -o -m1 avx512f /proc/cpuinfo | tee -a machine.txt || echo "no avx512f" | tee -a machine.txt
          free -g | tee -a machine.txt
      - name: Set up ann-benchmarks
        run: |
          git clone --depth 1 https://github.com/erikbern/ann-benchmarks ab
          cd ab
          pip install -r requirements.txt
          rm -rf ann_benchmarks/algorithms/raven && cp -r ../ann_benchmarks/algorithms/raven ann_benchmarks/algorithms/raven
          rm -rf ann_benchmarks/algorithms/raven/__pycache__
          if [ "${{ matrix.algo }}" = raven ]; then cp ../bench/ab-sift-config.yml ann_benchmarks/algorithms/raven/config.yml
          else cp ../bench/ab-anchor-config.yml ann_benchmarks/algorithms/raven/config.yml; fi
          if [ "${{ matrix.algo }}" = descartes ]; then
            python - <<'P'
          import yaml
          p = "ann_benchmarks/algorithms/descartes/config.yml"
          c = yaml.safe_load(open(p))
          c["float"]["any"][0]["run_groups"]["FNG"]["args"]["M"] = [${{ matrix.part }}]
          yaml.safe_dump(c, open(p, "w"))
          P
          fi
          python install.py --algorithm raven
          if [ "${{ matrix.algo }}" != raven ]; then python install.py --algorithm ${{ matrix.algo }}; fi
      - name: Run
        working-directory: ab
        run: |
          python run.py --dataset sift-128-euclidean --algorithm raven --runs 3
          if [ "${{ matrix.algo }}" != raven ]; then
            NAME=$(python -c "import yaml;print(yaml.safe_load(open('ann_benchmarks/algorithms/${{ matrix.algo }}/config.yml'))['float'][list(yaml.safe_load(open('ann_benchmarks/algorithms/${{ matrix.algo }}/config.yml'))['float'])[0]][0]['name'])")
            timeout 18000 python run.py --dataset sift-128-euclidean --algorithm "$NAME" --runs 3 || true
          fi
      - name: Export
        if: always()
        working-directory: ab
        run: |
          python data_export.py --output ../result.csv || true
          cp ../machine.txt ../result-machine.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sift-${{ matrix.algo }}-${{ matrix.part }}
          path: |
            result.csv
            result-machine.txt
